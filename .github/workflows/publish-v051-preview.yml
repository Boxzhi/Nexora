name: Publish Nexora v0.5.1-preview
on:
  push:
    branches:
      - release/v0.5.1-preview
    paths:
      - .github/workflows/publish-v051-preview.yml
permissions:
  contents: write
concurrency:
  group: nexora-v051-preview-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.repository == 'Boxzhi/Nexora' && github.ref == 'refs/heads/release/v0.5.1-preview'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Boxzhi/Nexora
      RELEASE_TAG: v0.5.1-preview
      RELEASE_SHA: c5de150e04ffc25fb423a2c12c03dd06315c84bd
    steps:
      - name: Verify pinned candidate and publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/commits/$RELEASE_SHA" --jq .sha | grep -Fx "$RELEASE_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing reuse."
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## 回复质量
          - 菜单、原生注册意图、完整句式及结构化只读查询共享回复格式化层，保留 IntentResponse 元数据。
          - 对已验证的洗衣机、净水器、空调及阳台场景进行语义整合；未知格式及部分失败保留原文。
          - 无损去除明确物理量的整数小数尾零，保持金额精度、日期、时效和安全说明。
          - 区分部分有效、数据缺失、设备状态限制、配置限制；query_quality 与执行路由成功统计独立。
          ## 能力诊断及自然语言
          - HA 集成诊断下载提供可见性原因、灯具支持模式、当前或缓存证据；不包含实际实体 ID 或对话内容。
          - 新增常见余额、灯光、洗衣进度、滤芯、入户安全问句；补强混合查询/控制保护。
          ## 验证
          - 固定候选 c5de150：248项自动化测试、443项原能力模拟执行、6225条旧组合语料、85条旧独立语料、886条旧反例、68条 v0.5.0 独立语料、30条旧版独立反例、8项备用代理、42项脱敏回复结构回放、11条新增独立口语及8条新增反例通过。
          - 纯规划器 CI P95 0.0408ms（1272次），不含 HA 识别与执行或微信传输；固定回归集并非盲测准确率。
          - Hassfest 通过，HACS 8/10（Topics、Brands 未通过）。真实 v0.5.1 HA、隐藏能力原因及微信交互仍待用户验收。
          ## 升级
          - 仅升级 Nexora；保留现有四套8个意图库 YAML、CN IM Hub、AI Hub、SGCC Add-on 及配置。
          - bindings.yaml 仍可选。HACS 安装预览版后重启 Core；异常时恢复 v0.5.0-preview。
          - 独立验收 ZIP 单独交付，不作为 Release 附件。本版不是正式稳定版。
          EOF
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$RELEASE_SHA" --title "Nexora v0.5.1-preview" --prerelease --latest=false --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url,tagName,isPrerelease,isDraft
